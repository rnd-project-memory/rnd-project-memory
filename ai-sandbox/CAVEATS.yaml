# rnd-project-memory — Caveats register
#
# This project has no data environment (see AGENTS.md), so the traps here are tool traps from
# the experiment harness rather than data traps. The register stood empty until 2026-08-27.
#
# Data and tool traps: things that produce a plausible, wrong answer without an error.
# Search by `subject` before touching what it names — this file is found, not read start to end.
#
# Append-only. Never regenerated, and NOT subject to the delete-on-resolve rule the rest of this
# system follows (P-024 in the design notes): a trap does not stop being true when it is
# "closed", only its data moves. Fix it in place with `corrected:` / `superseded_by:`, never
# delete the entry.
#
# Fields:
#   id        C-<slug>. Assigned once, never renamed.
#   subject   The lookup key: a table, a column, a script path.
#   kind      Free text — e.g. `table`, `tool`. No fixed dictionary on purpose.
#   severity  critical | moderate | minor. `critical` means fails silently, not "important".
#   what      What actually happens, in prose.
#   found     Date discovered.
#   basis     EXP-… / sessions/… / S-… — or `—` if genuinely none exists.
#   status    (optional) confirmed | inferred | unverified-by-design.
#   verify    (optional) Required when status is `inferred`: the check that would settle it.
#   corrected / superseded_by  (optional) How this was addressed, without deleting the record.

- id: C-copilot-model-build
  subject: GitHub Copilot CLI — the model identifier shown to the user
  kind: tool
  severity: critical
  what: >
    Copilot CLI v1.0.80 exposes a model *name* and no build. "GPT-5.6 Luna" in two runs a
    fortnight apart may be two different models, and nothing in the interface says so. The
    plausible wrong answer this produces is the one the green-start experiments are built on:
    two runs are compared, they differ, and the difference is attributed to the change under
    test when the model moved underneath. It fails silently in the exact sense this register
    reserves `critical` for — there is no error, no warning, and the comparison looks sound.
    What can be recorded is the name as displayed, the CLI version, and the timestamp; the
    timestamp is the only proxy for the build, and it is a weak one.
    Mitigation is design, not instrumentation: run the arms of a comparison close together, and
    repeat one condition so that run-to-run variance and model drift land in the same measured
    bucket rather than in an assumption.
  found: 2026-08-27
  basis: sessions/2026-08-27-adr-013-and-the-rule-it-withdraws.md
  status: confirmed
